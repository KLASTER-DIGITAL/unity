<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Worker Debug</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #0f0;
        }
        .info { margin: 10px 0; }
        .label { color: #0ff; }
        .value { color: #ff0; }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin: 10px 5px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
        }
        button:hover {
            background: #0ff;
        }
        .error { color: #f00; }
        .success { color: #0f0; }
    </style>
</head>
<body>
    <h1>🔍 Service Worker Debug</h1>
    <div id="output"></div>
    
    <h2>Actions:</h2>
    <button onclick="checkSW()">Check SW Status</button>
    <button onclick="updateSW()">Force Update</button>
    <button onclick="unregisterSW()">Unregister SW</button>
    <button onclick="clearCache()">Clear Cache</button>

    <script>
        const output = document.getElementById('output');
        
        function log(label, value, isError = false) {
            const className = isError ? 'error' : 'value';
            output.innerHTML += `<div class="info"><span class="label">${label}:</span> <span class="${className}">${value}</span></div>`;
        }

        async function checkSW() {
            output.innerHTML = '';
            log('Checking Service Worker...', '');
            
            if (!('serviceWorker' in navigator)) {
                log('ERROR', 'Service Worker not supported', true);
                return;
            }
            
            try {
                const registration = await navigator.serviceWorker.getRegistration();
                
                if (!registration) {
                    log('ERROR', 'No Service Worker registered', true);
                    return;
                }
                
                log('✅ Registration found', 'Yes');
                log('Scope', registration.scope);
                
                if (registration.active) {
                    log('Active SW', registration.active.scriptURL);
                    log('Active SW State', registration.active.state);
                }
                
                if (registration.waiting) {
                    log('⚠️ Waiting SW', registration.waiting.scriptURL, true);
                    log('Waiting SW State', registration.waiting.state);
                    log('ACTION NEEDED', 'New version available! Click "Force Update"', true);
                }
                
                if (registration.installing) {
                    log('Installing SW', registration.installing.scriptURL);
                    log('Installing SW State', registration.installing.state);
                }
                
                // Check cache version
                const caches = await window.caches.keys();
                log('Cache Keys', caches.join(', '));
                
            } catch (error) {
                log('ERROR', error.message, true);
            }
        }

        async function updateSW() {
            output.innerHTML = '';
            log('Forcing update...', '');
            
            try {
                const registration = await navigator.serviceWorker.getRegistration();
                
                if (!registration) {
                    log('ERROR', 'No Service Worker registered', true);
                    return;
                }
                
                if (registration.waiting) {
                    log('Sending SKIP_WAITING message...', '');
                    registration.waiting.postMessage({ type: 'SKIP_WAITING' });
                    
                    // Wait for controller change
                    navigator.serviceWorker.addEventListener('controllerchange', () => {
                        log('✅ SUCCESS', 'Page will reload in 2 seconds...', false);
                        setTimeout(() => {
                            window.location.reload();
                        }, 2000);
                    });
                } else {
                    log('Checking for updates...', '');
                    await registration.update();
                    
                    setTimeout(async () => {
                        const reg = await navigator.serviceWorker.getRegistration();
                        if (reg && reg.waiting) {
                            log('✅ Update found!', 'Click "Force Update" again', false);
                        } else {
                            log('No updates available', 'You have the latest version');
                        }
                    }, 2000);
                }
                
            } catch (error) {
                log('ERROR', error.message, true);
            }
        }

        async function unregisterSW() {
            output.innerHTML = '';
            log('Unregistering Service Worker...', '');
            
            try {
                const registration = await navigator.serviceWorker.getRegistration();
                
                if (!registration) {
                    log('No Service Worker to unregister', '');
                    return;
                }
                
                await registration.unregister();
                log('✅ SUCCESS', 'Service Worker unregistered', false);
                log('ACTION', 'Reload page to re-register', false);
                
            } catch (error) {
                log('ERROR', error.message, true);
            }
        }

        async function clearCache() {
            output.innerHTML = '';
            log('Clearing cache...', '');
            
            try {
                const cacheNames = await window.caches.keys();
                
                for (const cacheName of cacheNames) {
                    await window.caches.delete(cacheName);
                    log('Deleted cache', cacheName);
                }
                
                log('✅ SUCCESS', 'All caches cleared', false);
                log('ACTION', 'Reload page to rebuild cache', false);
                
            } catch (error) {
                log('ERROR', error.message, true);
            }
        }

        // Auto-check on load
        window.addEventListener('load', () => {
            checkSW();
        });
    </script>
</body>
</html>
