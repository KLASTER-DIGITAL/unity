<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Push Subscription Test</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .test-section {
            background: #2a2a2a;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        button {
            background: #0070f3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0051cc;
        }
        .result {
            background: #1a1a1a;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .success { color: #0f0; }
        .error { color: #f00; }
        .warning { color: #ff0; }
    </style>
</head>
<body>
    <h1>🔔 Push Subscription Test</h1>
    
    <div class="test-section">
        <h2>1. Platform Detection</h2>
        <button onclick="testPlatform()">Test Platform</button>
        <div id="platform-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>2. Service Worker</h2>
        <button onclick="testServiceWorker()">Test Service Worker</button>
        <div id="sw-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>3. VAPID Key</h2>
        <button onclick="testVapidKey()">Test VAPID Key</button>
        <div id="vapid-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>4. Push Subscription</h2>
        <button onclick="testSubscription()">Test Subscription</button>
        <div id="subscription-result" class="result"></div>
    </div>

    <script>
        function log(elementId, message, type = 'info') {
            const el = document.getElementById(elementId);
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'warning' ? 'warning' : '';
            el.innerHTML += `<span class="${className}">${message}</span>\n`;
        }

        function _testPlatform() {
            const el = document.getElementById('platform-result');
            el.innerHTML = '';
            
            log('platform-result', '=== Platform Detection ===');
            log('platform-result', `User Agent: ${navigator.userAgent}`);
            log('platform-result', `Service Worker: ${'serviceWorker' in navigator ? '✅ Supported' : '❌ Not supported'}`, 'serviceWorker' in navigator ? 'success' : 'error');
            log('platform-result', `Push Manager: ${'PushManager' in window ? '✅ Supported' : '❌ Not supported'}`, 'PushManager' in window ? 'success' : 'error');
            log('platform-result', `Notification: ${typeof Notification !== 'undefined' ? '✅ Supported' : '❌ Not supported'}`, typeof Notification !== 'undefined' ? 'success' : 'error');
            log('platform-result', `Permission: ${Notification.permission}`);
        }

        async function _testServiceWorker() {
            const el = document.getElementById('sw-result');
            el.innerHTML = '';
            
            log('sw-result', '=== Service Worker Test ===');
            
            if (!('serviceWorker' in navigator)) {
                log('sw-result', '❌ Service Worker not supported', 'error');
                return;
            }

            try {
                const registrations = await navigator.serviceWorker.getRegistrations();
                log('sw-result', `Found ${registrations.length} Service Worker(s)`, 'success');
                
                registrations.forEach((reg, i) => {
                    log('sw-result', `\nService Worker ${i + 1}:`);
                    log('sw-result', `  Scope: ${reg.scope}`);
                    log('sw-result', `  Active: ${reg.active ? '✅ Yes' : '❌ No'}`, reg.active ? 'success' : 'error');
                    log('sw-result', `  Installing: ${reg.installing ? '⏳ Yes' : 'No'}`);
                    log('sw-result', `  Waiting: ${reg.waiting ? '⏳ Yes' : 'No'}`);
                });

                // Wait for ready
                const ready = await navigator.serviceWorker.ready;
                log('sw-result', '\n✅ Service Worker is ready!', 'success');
                log('sw-result', `Ready scope: ${ready.scope}`);
            } catch (error) {
                log('sw-result', `❌ Error: ${error.message}`, 'error');
            }
        }

        async function _testVapidKey() {
            const el = document.getElementById('vapid-result');
            el.innerHTML = '';
            
            log('vapid-result', '=== VAPID Key Test ===');
            
            try {
                const response = await fetch('https://ecuwuzqlwdkkdncampnc.supabase.co/rest/v1/admin_settings?key=eq.vapid_public_key&select=value', {
                    headers: {
                        'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjdXd1enFsd2Rra2RuY2FtcG5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzA0NTU5NzAsImV4cCI6MjA0NjAzMTk3MH0.qstJJLdGhRSdW5pHqW0FqhHELqw8_Zt-Zt5Zt5Zt5Zt'
                    }
                });

                const data = await response.json();
                
                if (data && data.length > 0 && data[0].value) {
                    log('vapid-result', '✅ VAPID key found!', 'success');
                    log('vapid-result', `Key: ${data[0].value.substring(0, 50)}...`);
                } else {
                    log('vapid-result', '❌ VAPID key not found', 'error');
                    log('vapid-result', `Response: ${JSON.stringify(data)}`);
                }
            } catch (error) {
                log('vapid-result', `❌ Error: ${error.message}`, 'error');
            }
        }

        async function _testSubscription() {
            const el = document.getElementById('subscription-result');
            el.innerHTML = '';
            
            log('subscription-result', '=== Push Subscription Test ===');
            
            // 1. Check permission
            log('subscription-result', `Current permission: ${Notification.permission}`);
            
            if (Notification.permission === 'denied') {
                log('subscription-result', '❌ Permission denied. Please reset in browser settings.', 'error');
                return;
            }

            // 2. Request permission
            if (Notification.permission === 'default') {
                log('subscription-result', 'Requesting permission...');
                const permission = await Notification.requestPermission();
                log('subscription-result', `Permission result: ${permission}`, permission === 'granted' ? 'success' : 'error');
                
                if (permission !== 'granted') {
                    return;
                }
            }

            // 3. Get Service Worker
            try {
                const registration = await navigator.serviceWorker.ready;
                log('subscription-result', '✅ Service Worker ready', 'success');

                // 4. Get VAPID key
                const vapidResponse = await fetch('https://ecuwuzqlwdkkdncampnc.supabase.co/rest/v1/admin_settings?key=eq.vapid_public_key&select=value', {
                    headers: {
                        'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjdXd1enFsd2Rra2RuY2FtcG5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzA0NTU5NzAsImV4cCI6MjA0NjAzMTk3MH0.qstJJLdGhRSdW5pHqW0FqhHELqw8_Zt-Zt5Zt5Zt5Zt'
                    }
                });
                const vapidData = await vapidResponse.json();
                const vapidKey = vapidData[0].value;
                log('subscription-result', '✅ VAPID key loaded', 'success');

                // 5. Subscribe
                log('subscription-result', 'Subscribing to push...');
                const subscription = await registration.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: vapidKey
                });

                log('subscription-result', '✅ Subscription successful!', 'success');
                log('subscription-result', `Endpoint: ${subscription.endpoint.substring(0, 50)}...`);
                log('subscription-result', `\nFull subscription:\n${JSON.stringify(subscription.toJSON(), null, 2)}`);
            } catch (error) {
                log('subscription-result', `❌ Error: ${error.message}`, 'error');
                log('subscription-result', `Stack: ${error.stack}`);
            }
        }
    </script>
</body>
</html>
